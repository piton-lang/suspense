[package]
name = "suspense"
version = "0.1.0"
edition = "2024"
description = "A REPL and notebook for Piton: write prompts that reference the spec and keep a history of prompts saved as files."
publish = false

[[bin]]
name = "suspense"
path = "src/main.rs"

[dependencies]
anyhow = "1"
dirs = "6"
futures = "0.3"
gpui-kit = { version = "0.6.1", features = ["tree-sitter", "tree-sitter-bash"] }
ignore = "0.4"
lsp-types = "0.97"
notify = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2.7"
tree-sitter = "0.26"
tree-sitter-language = "0.1"

[dev-dependencies]
gpui-kit = { version = "0.6.1", features = ["tree-sitter", "tree-sitter-bash", "test-support"] }

[build-dependencies]
cc = "1"

[profile.dev.package."*"]
opt-level = 2
